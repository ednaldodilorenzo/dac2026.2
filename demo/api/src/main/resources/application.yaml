spring:
  application:
    name: base
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://db:5432/demo
    username: demo
    password: secret
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    web:
      pageable:
        max-page-size: 20